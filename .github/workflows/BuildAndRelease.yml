name: Java Hybrid Build (Maven + Ant) & Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
      - '[0-9]*'

permissions:
  contents: write

jobs:

  # BUILD
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4

    - name: Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'
        cache: 'maven'

    # Compilar logica (Maven):
    - name: Compilar LogicaJuegos
      run: |
        cd Materializacion/LogicaJuegos
        mvn clean package
        ls -al target

    # Preparar dependencias:
    - name: Empaquetar dependencias
      run: |
        cd Materializacion/ApartadoVisual
        mkdir -p lib
        
        # nos bajamos AbsoluteLayout y el jdbc desde maven.org:
        wget -O lib/mysql-connector-j-9.7.0.jar https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.7.0/mysql-connector-j-9.7.0.jar
        wget -O lib/AbsoluteLayout.jar https://repo1.maven.org/maven2/org/netbeans/external/AbsoluteLayout/RELEASE140/AbsoluteLayout-RELEASE140.jar        

    # Compilar (Ant):
    - name: Compilar ApartadoVisual
      run: |
        cd Materializacion/ApartadoVisual
        ant -Dplatforms.JDK_22.home=$JAVA_HOME \
            -Dlibs.absolutelayout.classpath=lib/AbsoluteLayout.jar \
            -Dlibs.mysql-connector-j-9.7.0.classpath=lib/mysql-connector-j-9.7.0.jar \
            -Dmkdist.disabled=true \
            -Ddist.jar=dist/NCA-DESAFIO-EQUIPO-6-$GITHUB_REF_NAME.jar \
            clean jar
        ls -al dist
    #  y empaquetar
    - name: Empaquetar
      run: |
        cd Materializacion/ApartadoVisual
        mkdir -p dist/lib
        cp ../LogicaJuegos/target/*.jar dist/lib/
        cp lib/*.jar dist/lib/
        cp ../../README.txt dist/
        ls -al dist dist/lib

    # Nos guardamos dist para el empaquetado
    - name: Subir dist como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: Materializacion/ApartadoVisual/dist/

    # Comprimir
    - name: Comprimir carpeta dist a ZIP
      run: |
        cd Materializacion/ApartadoVisual/dist
        zip -r ../../../DESAFIO-EQUIPO-6.zip *

    # Crear Release
    - name: Crear GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: DESAFIO-EQUIPO-6.zip
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: ${{ startsWith(github.ref_name, 'v0') || startsWith(github.ref_name, 'V0') || startsWith(github.ref_name, '0') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PACKAGE
  package:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Descargar dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generar instalador con jpackage
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          VERSION=${VERSION#V}
          jpackage --input dist/ \
                   --dest instalador/ \
                   --main-jar NCA-DESAFIO-EQUIPO-6-$GITHUB_REF_NAME.jar \
                   --main-class pantallas.DesafioJuegoPPT3Ralla \
                   --name "NCA-DESAFIO-EQUIPO-6" \
                   --app-version $VERSION

      - name: Subir instalador al Release
        uses: softprops/action-gh-release@v2
        with:
          files: instalador/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
